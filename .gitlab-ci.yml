default:
  image: node:22-alpine

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

deploy-pages:
  stage: deploy
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
    - npm run build
  pages:
    publish: dist
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: $CI_PAGES_URL
